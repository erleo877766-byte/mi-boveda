name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Remove local-only files from workspace
        shell: pwsh
        run: |
          if (Test-Path server) { Remove-Item -Recurse -Force server }
          if (Test-Path lib/.secrets.g.dart) { Remove-Item -Force lib/.secrets.g.dart }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Git
        run: |
          git config --global --add safe.directory '*'
          git config --global user.email "erleo877766@gmail.com"
          git config --global user.name "Leonardo Salazar"

      - name: Clone bitbox_flutter
        run: |
          git clone https://github.com/konstantinullrich/bitbox_flutter scripts/bitbox_flutter
          cd scripts/bitbox_flutter
          git checkout 5a6e6dd388ef64003f86094af80d5453518b601d
          git reset --hard

      - name: Fetch prebuilt Reown
        run: |
          cd scripts
          rm -rf reown_flutter reown_flutter.tar.gz
          curl -L -o reown_flutter.tar.gz https://github.com/cake-tech/reown_flutter/releases/download/v0.0.4/reown_flutter-v0.0.4.tar.gz
          mkdir -p reown_flutter
          cd reown_flutter && tar -xzf ../reown_flutter.tar.gz --exclude='*symlink*' || true
          rm -f ../reown_flutter.tar.gz

      - name: Fetch prebuilt Torch
        run: |
          cd scripts
          curl -L -o torch_dart.tar.gz https://github.com/MrCyjaneK/torch_dart/releases/download/v1.0.17/torch_dart-v1.0.17.tar.gz
          mkdir -p torch_dart
          cd torch_dart && tar -xzf ../torch_dart.tar.gz && cd ..
          rm torch_dart.tar.gz

      - name: Add empty secrets
        run: |
          mkdir -p lib
          touch lib/.secrets.g.dart
          for f in cw_bitcoin cw_evm cw_solana cw_nano cw_tron cw_dogecoin cw_zcash cw_bitcoin_cash cw_monero cw_core; do
            mkdir -p $f/lib
            touch $f/lib/.secrets.g.dart
          done

      - name: Generate pubspec.yaml
        run: |
          cp pubspec_description.yaml pubspec.yaml
          dart run tool/generate_pubspec.dart
          flutter pub get

      - name: Configure app
        run: dart run tool/configure.dart --monero --bitcoin --ethereum --polygon --nano --bitcoinCash --solana --tron --dogecoin --base --arbitrum --bsc

      - name: Generate secrets
        run: dart run tool/generate_new_secrets.dart

      - name: Inject ChangeNOW API key (from private secret)
        env:
          CHANGENOW_API_KEY: ${{ secrets.CHANGENOW_API_KEY }}
        run: |
          if [ -n "$CHANGENOW_API_KEY" ]; then
            sed -i "s/const changeNowCakeWalletApiKey = '';/const changeNowCakeWalletApiKey = '$CHANGENOW_API_KEY';/" lib/.secrets.g.dart
            echo "ChangeNOW API key injected."
          else
            echo "CHANGENOW_API_KEY not set; skipping injection."
          fi

      - name: Download prebuilt monero_c DLLs
        run: |
          TAG="v0.18.4.6-RC2"
          git clone https://github.com/mrcyjanek/monero_c.git scripts/monero_c
          cd scripts/monero_c
          git fetch --tags
          git checkout $TAG || git checkout 5952bef2ec01b0b7e57c11613cbdc081dcd727c5
          mkdir -p release
          cd release
          curl -L -o release-bundle.zip https://github.com/MrCyjaneK/monero_c/releases/download/$TAG/release-bundle.zip
          unzip -o release-bundle.zip
          shopt -s nullglob
          for inner in v0.18.4.6-*/; do
            mv "$inner"/* .
            rmdir "$inner"
          done
          shopt -u nullglob
          rm -f release-bundle.zip

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Patch flutter_local_notifications_windows coroutine
        run: |
          PLUGIN_DIR=$(find "$LOCALAPPDATA/Pub/Cache/hosted" -name "flutter_local_notifications_windows-*" -maxdepth 2 -type d 2>/dev/null | head -1)
          if [ -z "$PLUGIN_DIR" ]; then
            PLUGIN_DIR=$(find "$HOME/.pub-cache/hosted" -name "flutter_local_notifications_windows-*" -maxdepth 2 -type d 2>/dev/null | head -1)
          fi
          if [ -n "$PLUGIN_DIR" ]; then
            # Prepend #define to every source file to ensure it's defined before any system includes
            find "$PLUGIN_DIR" -type f \( -name "*.cpp" -o -name "*.h" \) -print0 | while IFS= read -r -d '' f; do
              if ! head -20 "$f" | grep -q "_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"; then
                sed -i '1i #define _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS' "$f"
              fi
            done
            # Also replace experimental/coroutine with coroutine
            find "$PLUGIN_DIR" -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's|experimental/coroutine|coroutine|g' {} + 2>/dev/null || true
            # Add to CMakeLists.txt as well
            for cmake_file in $(find "$PLUGIN_DIR" -name "CMakeLists.txt" -type f); do
              if ! grep -q "_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS" "$cmake_file"; then
                sed -i '1i add_definitions(-D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)' "$cmake_file"
              fi
            done
            echo "Patched $PLUGIN_DIR"
          else
            echo "flutter_local_notifications_windows not found - skipping patch"
          fi

      - name: Build generated code
        run: |
          for coin in cw_core cw_monero cw_bitcoin cw_evm cw_nano cw_bitcoin_cash cw_solana cw_tron cw_zcash cw_dogecoin cw_decred; do
            cd $coin
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs
            cd ..
          done
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate localization
        run: dart run tool/generate_localization.dart

      - name: Build Windows
        run: flutter build windows --dart-define-from-file=env.json --release --no-pub

      - name: Download VC++ Redistributable
        run: |
          curl -sL -o scripts/windows/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          ls -la scripts/windows/vc_redist.x64.exe

      - name: Build installer with Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" scripts/windows/build_exe_installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: miboveda-windows-setup
          path: |
            build/installer/MiBovedaSetup.exe
            build/windows/x64/runner/Release/MiBoveda.exe
          if-no-files-found: error

      - name: Prepare Windows installer for release
        if: github.ref_name == 'main'
        run: cp build/installer/MiBovedaSetup.exe MiBovedaSetup.exe

      - name: Create or update 'latest' release and upload Windows installer
        if: github.ref_name == 'main'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          tag: latest
          name: Latest
          body: |
            Mi Bóveda - release automático

            1) Descarga MiBoveda.apk (el principal)
            2) Ábrelo y toca "Instalar" -> listo

            MiBovedaAntiguos.apk: solo para teléfonos antiguos (32-bit)
            MiBovedaEmulador.apk: solo para emuladores o PC con Android
            En Windows: descarga MiBovedaSetup.exe -> doble clic -> Instalar -> listo

            ¿Te sale el aviso de Google Play Protect ("Esta app no tiene reputación")?
            Es normal: la app NO está en Google Play. Toca "Más detalles" -> "Instalar de todos modos" -> "Instalar".
            Está firmada con un certificado de lanzamiento propio y la tuya es tuya. Puedes ver su origen aquí: https://erleo877766-byte.github.io/mi-boveda/
          draft: false
          prerelease: false
          artifacts: MiBovedaSetup.exe
