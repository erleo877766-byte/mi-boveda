name: Generate release keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate release keystore
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          KEY_PASS=$STORE_PASS
          keytool -genkey -v -keystore miboveda-release.jks -keyalg RSA -keysize 2048 \
            -validity 10000 -alias miboveda -noprompt \
            -dname "CN=Mi Boveda, OU=Mi Boveda, O=Mi Boveda, L=Unknown, ST=Unknown, C=US" \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS"
          keytool -exportcert -keystore miboveda-release.jks -alias miboveda \
            -storepass "$STORE_PASS" | openssl sha256 > cert-sha256.txt
          printf 'STORE_PASSWORD=%s\nKEY_ALIAS=miboveda\nKEY_PASSWORD=%s\n' "$STORE_PASS" "$KEY_PASS" > passwords.txt
          ls -la miboveda-release.jks passwords.txt cert-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: miboveda-release-keystore
          path: |
            miboveda-release.jks
            passwords.txt
            cert-sha256.txt
          if-no-files-found: error
