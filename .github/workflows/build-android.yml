name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      STORE_PASS: miboveda_release
      KEY_PASS: miboveda_release

    steps:
      - uses: actions/checkout@v4

      - name: Remove local-only files from workspace
        run: |
          # Ensure server/ (local-only) and lib/.secrets.g.dart are not present in the CI workspace
          if [ -d server ]; then
            echo "Removing server/ from workspace (local-only)"
            rm -rf server
          else
            echo "server/ not present"
          fi
          if [ -f lib/.secrets.g.dart ]; then
            echo "Removing lib/.secrets.g.dart from workspace"
            rm -f lib/.secrets.g.dart
          else
            echo "lib/.secrets.g.dart not present"
          fi

      - name: Fix script permissions
        run: find scripts/ -name "*.sh" -exec chmod +x {} \;

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android SDK and NDK
        run: |
          mkdir -p ~/android-sdk
          export ANDROID_HOME=~/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Rust targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            rustup target add --toolchain stable $target
          done
          cargo install cargo-ndk

      - name: Fetch prebuilt Torch
        run: |
          pushd scripts
            wget -q https://github.com/MrCyjaneK/torch_dart/releases/download/v1.0.17/torch_dart-v1.0.17.tar.gz -O torch_dart.tar.gz
            mkdir -p torch_dart
            cd torch_dart && tar -xzf ../torch_dart.tar.gz && cd ..
