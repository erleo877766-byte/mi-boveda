name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      STORE_PASS: miboveda_release
      KEY_PASS: miboveda_release

    steps:
      - uses: actions/checkout@v4

      - name: Remove local-only files from workspace
        run: |
          rm -rf server
          rm -f lib/.secrets.g.dart

      - name: Fix script permissions
        run: find scripts/ -name "*.sh" -exec chmod +x {} \;

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/az_*
          sudo rm -rf /opt/microsoft
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/share/gradle-*
          sudo rm -rf /usr/share/sbt
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android SDK and NDK
        run: |
          mkdir -p ~/android-sdk
          export ANDROID_HOME=~/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Rust targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            rustup target add --toolchain stable $target
          done
          cargo install cargo-ndk

      - name: Fetch prebuilt Torch
        run: |
          pushd scripts
            wget -q https://github.com/MrCyjaneK/torch_dart/releases/download/v1.0.17/torch_dart-v1.0.17.tar.gz -O torch_dart.tar.gz
            mkdir -p torch_dart
            cd torch_dart && tar -xzf ../torch_dart.tar.gz && cd ..
            rm torch_dart.tar.gz
          popd

      - name: Fetch prebuilt Reown
        run: |
          pushd scripts
            rm -rf reown_flutter reown_flutter.tar.gz
            wget -q https://github.com/cake-tech/reown_flutter/releases/download/v0.0.4/reown_flutter-v0.0.4.tar.gz -O reown_flutter.tar.gz
            mkdir -p reown_flutter
            cd reown_flutter && tar -xzf ../reown_flutter.tar.gz && cd ..
            rm reown_flutter.tar.gz
          popd

      - name: Build Zcash Lib
        run: |
          pushd scripts/android
            bash ./build_zcash.sh
          popd

      - name: Clone bitbox_flutter
        run: |
          git clone https://github.com/konstantinullrich/bitbox_flutter scripts/bitbox_flutter
          cd scripts/bitbox_flutter
          git checkout 5a6e6dd388ef64003f86094af80d5453518b601d
          git reset --hard

      - name: Build bitbox_flutter
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          bash scripts/build_bitbox_flutter.sh

      - name: Download prebuilt monero_c
        run: |
          git config --global user.email "erleo877766@gmail.com"
          git config --global user.name "Leonardo Salazar"
          bash scripts/prepare_moneroc.sh
          mkdir -p scripts/monero_c/release
          pushd scripts/monero_c/release
            TAG=$(git describe --tags)
            mkdir -p "$TAG"
            pushd "$TAG"
              wget -q https://github.com/MrCyjaneK/monero_c/releases/download/v0.18.4.6-RC2/release-bundle.zip
              unzip -q release-bundle.zip
              shopt -s nullglob
              for inner in v0.18.4.6-*/; do
                mv "$inner"* .
                rmdir "$inner"
              done
              shopt -u nullglob
              rm release-bundle.zip
            popd
          popd

      - name: Copy monero/wownero/zano libs to jniLibs
        run: |
          BUNDLE_DIR=$(ls -d scripts/monero_c/release/v0.18.4.6-* 2>/dev/null | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            BUNDLE_DIR="scripts/monero_c/release/$(git -C scripts/monero_c describe --tags)"
          fi
          echo "Using bundle: $BUNDLE_DIR"
          for coin in monero wownero zano; do
            for pair in "aarch64-linux-android:arm64-v8a" "armv7a-linux-androideabi:armeabi-v7a" "x86_64-linux-android:x86_64"; do
              SRC=${pair%%:*}
              DST=${pair##*:}
              if [ -f "$BUNDLE_DIR/$SRC/lib${coin}_wallet2_api_c.so" ]; then
                mkdir -p "android/app/src/main/jniLibs/$DST"
                cp "$BUNDLE_DIR/$SRC/lib${coin}_wallet2_api_c.so" "android/app/src/main/jniLibs/$DST/lib${coin}_wallet2_api_c.so"
                echo "copied lib${coin}_wallet2_api_c.so -> jniLibs/$DST/"
              fi
            done
          done
          find android/app/src/main/jniLibs -name "*.so" | sort

      - name: Configure app
        run: |
          pushd scripts/android
            source ./app_env.sh miboveda
            bash ./app_config.sh
          popd

      - name: Add empty secrets
        run: |
          touch lib/.secrets.g.dart
          for f in cw_bitcoin cw_evm cw_solana cw_nano cw_tron; do
            mkdir -p $f/lib
            touch $f/lib/.secrets.g.dart
          done

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate platform code
        run: dart run tool/configure.dart --monero --bitcoin --ethereum --polygon --nano --bitcoinCash --solana --tron --wownero --zano --decred --dogecoin --base --zcash --arbitrum --bsc

      - name: Build mwebd
        run: |
          pushd scripts/android
            bash ./build_mwebd.sh
          popd

      - name: Build Decred
        run: |
          pushd scripts/android
            bash ./build_decred.sh
          popd

      - name: Build generated code
        run: bash ./model_generator.sh async

      - name: Generate secrets
        run: dart run tool/generate_new_secrets.dart

      - name: Inject ChangeNOW API key (from private secret)
        env:
          CHANGENOW_API_KEY: ${{ secrets.CHANGENOW_API_KEY }}
        run: |
          if [ -n "$CHANGENOW_API_KEY" ]; then
            sed -i "s/const changeNowCakeWalletApiKey = '';/const changeNowCakeWalletApiKey = '$CHANGENOW_API_KEY';/" lib/.secrets.g.dart
            echo "ChangeNOW API key injected."
          else
            echo "CHANGENOW_API_KEY not set; skipping injection."
          fi

      - name: Setup release signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          ls -la android/app/key.jks android/key.properties

      - name: Generate localization
        run: dart run tool/generate_localization.dart

      - name: Compile graphics
        run: bash ./compile_graphics.sh

      - name: Free more disk space before build
        run: |
          rm -rf scripts/monero_c/release
          rm -rf scripts/monero_c/.git
          rm -rf scripts/bitbox_flutter/.git
          rm -rf build/app/intermediates 2>/dev/null || true
          rm -rf build/flutter_assets 2>/dev/null || true
          df -h

      - name: Create swap space
        run: |
          if [ "$(free -m | awk '/^Swap:/{print $2}')" -gt 0 ]; then
            echo "Swap already available:"
            free -h
          else
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo "Swap created:"
            free -h
          fi

      - name: Build APK (arm64-v8a)
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" > android/gradle.properties.local
          cat android/gradle.properties android/gradle.properties.local > android/gradle.properties.tmp
          mv android/gradle.properties.tmp android/gradle.properties
          flutter build apk --dart-define=hasDevOptions=true --release --target-platform android-arm64
          df -h

      - name: Verify APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || \
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk || true
          fi
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miboveda-android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

      - name: Create or update release
        if: github.ref_name == 'main'
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk MiBoveda.apk 2>/dev/null || \
          cp build/app/outputs/flutter-apk/app-release.apk MiBoveda.apk 2>/dev/null || true
          ls -lh MiBoveda.apk

      - name: Upload release
        if: github.ref_name == 'main'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          tag: latest
          name: Latest
          body: |
            Mi Bóveda - release automático

            1) Descarga MiBoveda.apk
            2) Ábrelo y toca "Instalar" -> listo

            En Windows: descarga MiBovedaSetup.exe -> doble clic -> Instalar -> listo

            ¿Te sale el aviso de Google Play Protect?
            Toca "Más detalles" -> "Instalar de todos modos" -> "Instalar".
          draft: false
          prerelease: false
          artifacts: MiBoveda.apk
