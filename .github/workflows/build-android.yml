name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      STORE_PASS: miboveda_release
      KEY_PASS: miboveda_release

    steps:
      - uses: actions/checkout@v4

      - name: Fix script permissions
        run: find scripts/ -name "*.sh" -exec chmod +x {} \;

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Setup Go 1.24.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Android SDK and NDK
        run: |
          mkdir -p ~/android-sdk
          export ANDROID_HOME=~/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $ANDROID_HOME/cmdline-tools
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install Rust targets
        run: |
          for target in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            rustup target add --toolchain stable $target
          done
          cargo install cargo-ndk

      - name: Fetch prebuilt Torch
        run: |
          pushd scripts
            wget -q https://github.com/MrCyjaneK/torch_dart/releases/download/v1.0.17/torch_dart-v1.0.17.tar.gz -O torch_dart.tar.gz
            mkdir -p torch_dart
            cd torch_dart && tar -xzf ../torch_dart.tar.gz && cd ..
            rm torch_dart.tar.gz
          popd

      - name: Fetch prebuilt Reown
        run: |
          pushd scripts
            rm -rf reown_flutter reown_flutter.tar.gz
            wget -q https://github.com/cake-tech/reown_flutter/releases/download/v0.0.4/reown_flutter-v0.0.4.tar.gz -O reown_flutter.tar.gz
            mkdir -p reown_flutter
            cd reown_flutter && tar -xzf ../reown_flutter.tar.gz && cd ..
            rm reown_flutter.tar.gz
          popd

      - name: Build Zcash Lib
        run: |
          pushd scripts/android
            bash ./build_zcash.sh
          popd

      - name: Clone bitbox_flutter
        run: |
          git clone https://github.com/konstantinullrich/bitbox_flutter scripts/bitbox_flutter
          cd scripts/bitbox_flutter
          git checkout 5a6e6dd388ef64003f86094af80d5453518b601d
          git reset --hard

      - name: Build bitbox_flutter
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          bash scripts/build_bitbox_flutter.sh

      - name: Download prebuilt monero_c
        run: |
          git config --global user.email "erleo877766@gmail.com"
          git config --global user.name "Leonardo Salazar"
          bash scripts/prepare_moneroc.sh
          mkdir -p scripts/monero_c/release
          pushd scripts/monero_c/release
            TAG=$(git describe --tags)
            mkdir -p "$TAG"
            pushd "$TAG"
              wget -q https://github.com/MrCyjaneK/monero_c/releases/download/v0.18.4.6-RC2/release-bundle.zip
              unzip -q release-bundle.zip
              shopt -s nullglob
              for inner in v0.18.4.6-*/; do
                mv "$inner"* .
                rmdir "$inner"
              done
              shopt -u nullglob
              rm release-bundle.zip
            popd
          popd

      - name: Configure app
        run: |
          pushd scripts/android
            source ./app_env.sh miboveda
            bash ./app_config.sh
          popd

      - name: Add empty secrets
        run: |
          touch lib/.secrets.g.dart
          for f in cw_bitcoin cw_evm cw_solana cw_nano cw_tron; do
            mkdir -p $f/lib
            touch $f/lib/.secrets.g.dart
          done

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate platform code
        run: dart run tool/configure.dart --monero --bitcoin --ethereum --polygon --nano --bitcoinCash --solana --tron --wownero --zano --decred --dogecoin --base --zcash --arbitrum --bsc

      - name: Build mwebd
        run: |
          pushd scripts/android
            bash ./build_mwebd.sh
          popd

      - name: Build Decred
        run: |
          pushd scripts/android
            bash ./build_decred.sh
          popd

      - name: Build generated code
        run: bash ./model_generator.sh async

      - name: Generate secrets
        run: dart run tool/generate_new_secrets.dart

      - name: Generate key and key properties
        run: |
          pushd /opt/generic_cache || mkdir -p /opt/generic_cache && pushd /opt/generic_cache
            if [[ ! -f key.jks ]]; then
              keytool -genkey -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias testKey -noprompt -dname "CN=Mi Boveda, OU=Mi Boveda, O=Mi Boveda, L=Unknown, S=Unknown, C=US" -storepass $STORE_PASS -keypass $KEY_PASS
            fi
          popd
          cp /opt/generic_cache/key.jks android/app/
          dart run tool/generate_android_key_properties.dart keyAlias=testKey storeFile=key.jks storePassword=$STORE_PASS keyPassword=$KEY_PASS

      - name: Generate localization
        run: dart run tool/generate_localization.dart

      - name: Compile graphics
        run: bash ./compile_graphics.sh

      - name: Build APK
        run: |
          flutter build apk --dart-define=hasDevOptions=true --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miboveda-android-apk
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
