services:
  - type: web
    name: miboveda-cerebro
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CEREBRO_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
