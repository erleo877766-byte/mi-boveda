app-id: com.miboveda.MiBoveda
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: miboveda
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
modules:
  - name: miboveda
    buildsystem: simple
    build-commands:
      - "cp -R bundle /app/miboveda"
      - "chmod +x /app/miboveda/miboveda"
      - "mkdir -p /app/bin"
      - "ln -s /app/miboveda/miboveda /app/bin/miboveda"
      - "mkdir -p /app/share/icons/hicolor/scalable/apps"
      - "cp miboveda_icon_180.png /app/share/icons/hicolor/scalable/apps/com.miboveda.MiBoveda.png"
      - "mkdir -p /app/share/applications"
      - "cp com.miboveda.MiBoveda.desktop /app/share/applications"
    sources:
      - type: dir
        path: build/linux/x64/release
      - type: file
        path: assets/images/miboveda_icon_180.png
      - type: file
        path: linux/com.miboveda.MiBoveda.desktop
